# Builds both images and pushes them to GHCR. Deliberately separate from
# deployment: a build failure must never reach the box, and keeping the steps
# in different workflows makes that structural rather than a matter of ordering.
name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # The suite is a gate on the image, not a parallel opinion about it. Until
  # this job existed, build.yml and test.yml both fired on a push to main and
  # neither waited for the other: a commit that broke tenant isolation was
  # built, pushed to GHCR and deployed by deploy.yml while the tests were still
  # running -- and the red X arrived after the box was already serving it.
  #
  # Expressed as a called workflow rather than as branch protection because
  # this repository's branch settings are not ours to set, and because a gate
  # that lives in the repository is reviewable in the same pull request as the
  # code it guards. Branch protection on main is still worth adding on top; it
  # is what stops a direct push from bypassing pull requests altogether.
  tests:
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/alsigil-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/alsigil-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          # Empty means same-origin. This is inlined into the client bundle at
          # build time, so it can only be set here.
          build-args: |
            NEXT_PUBLIC_API_BASE=
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/alsigil-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/alsigil-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the web bundle is not pointing at localhost
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/alsigil-web:${{ github.sha }}"
          if docker run --rm "$image" grep -rl "localhost:8000" .next/static; then
            echo "::error::NEXT_PUBLIC_API_BASE did not reach the build."
            echo "The API would be healthy and the frontend completely broken."
            exit 1
          fi
          echo "Bundle is clean."
