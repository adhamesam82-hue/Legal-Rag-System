# The development track. Every image built from main lands here automatically,
# so "what is on staging" is always the head of main and never something a
# person claimed the environment for.
#
# Nothing is built here. The box pulls an image that already passed the suite,
# which is what keeps a broken build off the machine entirely.
name: Deploy staging

on:
  workflow_run:
    workflows: ["Build images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (a git SHA). Use this to roll staging back."
        required: true

jobs:
  deploy:
    # A failed build must not reach the box. workflow_run fires on failure too.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out which tag to deploy
        id: tag
        # image_tag is attacker-influenced: anyone who can dispatch this
        # workflow chooses it. Templating it into a `run:` block puts it inside
        # a double-quoted shell string, where $(...) and backticks execute on
        # the runner -- which holds SSH_PRIVATE_KEY. Through env: the shell only
        # ever sees a variable reference.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.image_tag }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'value=%s\n' "$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'value=%s\n' "$BUILT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        run: |
          install -d -m 0700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Record the tag currently running, for rollback
        id: previous
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          # No fallback to "latest": build.yml tags every image :latest too, so
          # on a bootstrap deploy "latest" is the image that just failed.
          # Falling back to it would redeploy the broken image while reporting
          # a rollback, which is worse than doing nothing.
          current=$(ssh "deploy@$SSH_HOST" \
            "cat /opt/alsigil-staging/deploy/.current_tag 2>/dev/null || true")
          printf 'value=%s\n' "$current" >> "$GITHUB_OUTPUT"
          echo "Currently deployed: ${current:-<none, first deploy to staging>}"

      - name: Sync the compose configuration
        env:
          OWNER: ${{ github.repository_owner }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          # Keep the live file so the rollback step can put it back: this step
          # overwrites the compose file *before* the swap, so a commit that
          # breaks it would otherwise leave a rolled-back image behind a broken
          # configuration while the run reports success.
          ssh "deploy@$SSH_HOST" bash -euo pipefail <<'EOF'
          cd /opt/alsigil-staging/deploy
          if [ -f docker-compose.staging.yml ]; then
            cp -p docker-compose.staging.yml docker-compose.staging.yml.rollback
          fi
          EOF
          scp deploy/docker-compose.staging.yml \
            "deploy@$SSH_HOST:/opt/alsigil-staging/deploy/"
          # The Caddyfile is deliberately NOT synced here. It belongs to the
          # production compose project -- Caddy serves both hostnames -- so
          # shipping it from the staging track would let a staging deploy
          # reconfigure the production proxy.
          printf 'GITHUB_REPOSITORY_OWNER=%s\n' "$OWNER" \
            | ssh "deploy@$SSH_HOST" "cat > /opt/alsigil-staging/deploy/.env"

      - name: Pull, migrate, and swap
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          OWNER: ${{ github.repository_owner }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        # A *quoted* heredoc, so neither the runner's shell nor GitHub
        # templating substitutes into it. The two values it needs are prepended
        # as `printf %q` assignments, which the remote bash re-reads as
        # literals -- a tag containing a quote is data on the box, not a command
        # running as deploy.
        run: |
          {
            printf 'IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'GITHUB_REPOSITORY_OWNER=%q\n' "$OWNER"
            cat <<'REMOTE'
          export IMAGE_TAG GITHUB_REPOSITORY_OWNER
          cd /opt/alsigil-staging/deploy
          docker compose -f docker-compose.staging.yml pull
          # A discrete step so a failed migration aborts the deploy instead of
          # leaving a container crash-looping against a half-applied schema.
          # stdin is redirected because this whole script is piped into bash
          # over ssh: `compose run` attaches stdin and would otherwise read the
          # rest of the script as the container's input, swallowing the swap
          # below it. bash then reaches EOF and exits 0, so the step reports
          # success having never replaced the running image.
          docker compose -f docker-compose.staging.yml run --rm -T api-staging \
            python scripts/migrate.py </dev/null
          docker compose -f docker-compose.staging.yml up -d
          printf '%s\n' "$IMAGE_TAG" > /opt/alsigil-staging/deploy/.current_tag
          REMOTE
          } | ssh "deploy@$SSH_HOST" bash -euo pipefail

      - name: Set up Python for the smoke check
        uses: astral-sh/setup-uv@v5

      - name: Smoke check
        id: smoke
        # Pinned to the box, like production's: the check must reach the machine
        # this workflow deployed to rather than whatever DNS answers for the
        # name. SMOKE_BASIC_AUTH is what gets it past Caddy's password, which
        # covers /api/* too -- without it every run would read 401 as a broken
        # deployment and roll back a healthy one.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SMOKE_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: |
          uv run --with httpx python scripts/smoke_check.py \
            https://staging.alsigil.com "$SSH_HOST"

      - name: Report that no rollback target exists
        if: failure() && steps.previous.outputs.value == ''
        run: |
          echo "::error::Staging deploy failed and there is no previous tag to roll back to."
          echo "::error::This is the first deploy to staging. Investigate before retrying."
          exit 1

      - name: Roll back to the previous tag
        # Keyed off steps.previous rather than steps.smoke: when the swap itself
        # fails, every later step including the smoke check is skipped, so
        # steps.smoke.outcome would be 'skipped' and this would never fire for
        # exactly the case that leaves containers half old and half new.
        if: failure() && steps.previous.outcome == 'success' && steps.previous.outputs.value != ''
        env:
          IMAGE_TAG: ${{ steps.previous.outputs.value }}
          OWNER: ${{ github.repository_owner }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "::error::Staging deploy failed. Rolling back to $IMAGE_TAG."
          {
            printf 'IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'GITHUB_REPOSITORY_OWNER=%q\n' "$OWNER"
            cat <<'REMOTE'
          export IMAGE_TAG GITHUB_REPOSITORY_OWNER
          cd /opt/alsigil-staging/deploy
          if [ -f docker-compose.staging.yml.rollback ]; then
            mv docker-compose.staging.yml.rollback docker-compose.staging.yml
          fi
          docker compose -f docker-compose.staging.yml up -d
          printf '%s\n' "$IMAGE_TAG" > /opt/alsigil-staging/deploy/.current_tag
          REMOTE
          } | ssh "deploy@$SSH_HOST" bash -euo pipefail
          exit 1
