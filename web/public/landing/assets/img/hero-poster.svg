<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Al-Sijil product surfaces">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FAF9FC"/>
      <stop offset="55%" stop-color="#F4F2F8"/>
      <stop offset="100%" stop-color="#EDEAF3"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.74" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#5B4FA6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#5B4FA6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowN" cx="0.14" cy="0.86" r="0.6">
      <stop offset="0%" stop-color="#DCD8E8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EAE7F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.44" r="0.72">
      <stop offset="42%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2A2736" stop-opacity="0.08"/>
    </radialGradient>
    <linearGradient id="barV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B4FA6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5B4FA6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rowV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5B4FA6" stop-opacity="0.14"/>
    </linearGradient>
    <mask id="gridFade">
      <radialGradient id="gf" cx="0.42" cy="0.46" r="0.62">
        <stop offset="20%" stop-color="#fff"/>
        <stop offset="100%" stop-color="#000"/>
      </radialGradient>
      <rect width="1600" height="900" fill="url(#gf)"/>
    </mask>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>
  <rect width="1600" height="900" fill="url(#glowN)"/>
  <rect width="1600" height="900" fill="url(#glowV)"/>

  <g mask="url(#gridFade)" stroke="#5B4FA6" stroke-opacity="0.13" stroke-width="1">
    <path d="M112 0v900M224 0v900M336 0v900M448 0v900M560 0v900M672 0v900M784 0v900M896 0v900M1008 0v900M1120 0v900M1232 0v900M1344 0v900M1456 0v900"/>
    <path d="M0 112h1600M0 224h1600M0 336h1600M0 448h1600M0 560h1600M0 672h1600M0 784h1600"/>
  </g>

  <!-- matter rows -->
  <g>
    <rect x="150" y="286" width="392" height="13" rx="6.5" fill="url(#rowV)"/>
    <rect x="150" y="336" width="278" height="13" rx="6.5" fill="url(#rowV)" opacity="0.82"/>
    <rect x="150" y="386" width="450" height="13" rx="6.5" fill="url(#rowV)" opacity="0.66"/>
    <rect x="150" y="436" width="240" height="13" rx="6.5" fill="url(#rowV)" opacity="0.5"/>
    <rect x="150" y="486" width="348" height="13" rx="6.5" fill="url(#rowV)" opacity="0.36"/>
    <rect x="150" y="536" width="418" height="13" rx="6.5" fill="url(#rowV)" opacity="0.24"/>
  </g>

  <!-- the verified clause and its badge -->
  <g>
    <rect x="150" y="386" width="450" height="13" rx="6.5" fill="#2A2736" opacity="0.3"/>
    <rect x="150" y="408" width="450" height="2.5" rx="1.25" fill="#5B4FA6" opacity="0.9"/>
    <rect x="150" y="440" width="196" height="34" rx="8" fill="#5B4FA6" fill-opacity="0.1" stroke="#5B4FA6" stroke-opacity="0.4"/>
    <g transform="translate(162, 447) scale(0.85)" fill="#5B4FA6">
      <path d="M1 21h12v2H1v-2zM5.245 8.05l2.83-2.83 9.9 9.9-2.83 2.83-9.9-9.9zM12.317 3.808l2.828-2.829 5.657 5.657-2.828 2.829-5.657-5.657zM3.832 12.293l2.829-2.828 5.656 5.657-2.828 2.828-5.657-5.657z"/>
    </g>
    <rect x="188" y="452" width="140" height="4" rx="2" fill="#5B4FA6" opacity="0.55"/>
    <rect x="188" y="461" width="96" height="4" rx="2" fill="#5B4FA6" opacity="0.32"/>
  </g>

  <!-- performance bars -->
  <g>
    <rect x="1004" y="558" width="52" height="132" rx="9" fill="url(#barV)"/>
    <rect x="1074" y="486" width="52" height="204" rx="9" fill="url(#barV)"/>
    <rect x="1144" y="534" width="52" height="156" rx="9" fill="url(#barV)"/>
    <rect x="1214" y="418" width="52" height="272" rx="9" fill="url(#barV)"/>
    <rect x="1284" y="502" width="52" height="188" rx="9" fill="url(#barV)"/>
    <rect x="1354" y="368" width="52" height="322" rx="9" fill="url(#barV)"/>
  </g>

  <!-- matter timeline -->
  <g>
    <path d="M1000 740h420" stroke="#2A2736" stroke-opacity="0.16" stroke-width="1.6"/>
    <circle cx="1060" cy="740" r="5.5" fill="#5B4FA6" opacity="0.85"/>
    <circle cx="1170" cy="740" r="5.5" fill="#5B4FA6" opacity="0.7"/>
    <circle cx="1280" cy="740" r="5.5" fill="#5B4FA6" opacity="0.5"/>
    <circle cx="1390" cy="740" r="8" fill="#5B4FA6" opacity="0.95"/>
  </g>

  <path d="M980 700 C1090 660, 1150 590, 1250 596 S1420 470, 1470 430"
        fill="none" stroke="#2A2736" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

  <rect width="1600" height="900" fill="url(#vign)"/>
  <rect width="1600" height="900" fill="#EDEAF3" opacity="0.28"/>
</svg>
