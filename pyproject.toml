[project]
name = "legal-rag-system"
version = "0.1.0"
description = "Arabic legal Q&A research tool (Egypt + Saudi Arabia)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "fastapi>=0.141.1",
    "fastapi-clerk-auth>=0.0.9",
    # Firebase ID token verification for the consumer mobile app (auth.py).
    # Arrives transitively via fastapi-clerk-auth, but this is now a direct
    # dependency and the signature check is security-critical -- it must not
    # rest on another package continuing to pull it in.
    "pyjwt[crypto]>=2.9",
    # Declared explicitly rather than relied on transitively: it is the server
    # that actually runs the API, so a deployment must not depend on FastAPI
    # happening to pull it in.
    "uvicorn[standard]>=0.30",
    # Multipart form parsing for document uploads.
    "python-multipart>=0.0.9",
    "psycopg-pool>=3.3.1",
    # Error reporting. Uptime tells us that something broke; this tells us what,
    # which on a single-operator deployment is most of the recovery time.
    "sentry-sdk[fastapi]>=2.0",
    # Invoice PDFs. Arabic needs all three: reportlab draws, arabic-reshaper
    # joins the letterforms (Arabic is cursive, so codepoint order is not
    # glyph order), and python-bidi lays them right to left. Drop either of
    # the last two and the PDF comes out as disconnected letters running
    # backwards -- worse than no PDF, because it reads as the firm's fault.
    "reportlab>=4.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# Corpus ingestion and the original Streamlit prototype. Kept out of the
# project dependencies because the API imports none of it, and these packages
# (streamlit, datasets, and their pandas/pyarrow/pillow tail) are most of the
# deployed image's size. Installed locally by default; excluded from the
# container via `uv sync --no-default-groups` in the Dockerfile.
ingest = [
    "streamlit>=1.38",
    "datasets>=3.0",
]

[tool.uv]
default-groups = ["dev", "ingest"]

[tool.pytest.ini_options]
pythonpath = [".", "evals"]
testpaths = ["tests", "evals"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
