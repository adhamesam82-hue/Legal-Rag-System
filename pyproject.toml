[project]
name = "legal-rag-system"
version = "0.1.0"
description = "Arabic legal Q&A research tool (Egypt + Saudi Arabia)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "openai>=1.50",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "fastapi>=0.141.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "evals"]
testpaths = ["tests", "evals"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
