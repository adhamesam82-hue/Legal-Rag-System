- id: goldset-001
  question: What does Article 558 of the Egyptian Civil Code (Law 131/1948) say a lease contract is?
  jurisdiction: EG
  expected_articles:
  - 131/1948 Art. 558
  category: exact_citation
  notes: 'Verified text: ''الإيجار عقد يلتزم المؤجر بمقتضاه أن يمكن المستأجر من الانتفاع بشىء معين عدة معينة لقاء أجر معلوم'' (lease = contract giving the tenant use of a thing for a period against rent).'
