services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalrag}
      POSTGRES_DB: ${POSTGRES_DB:-legalrag}
    ports:
      # Overridable because a machine with its own Postgres already has 5432
      # taken, and the collision is silent: the container starts, the client
      # connects to the wrong server, and the failure looks like a missing
      # table. Set POSTGRES_PORT alongside DATABASE_URL when that happens.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalrag -d legalrag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # Pinned rather than left to derive from the compose project name (the
  # directory name). This project was created under the directory name
  # phase1-corpus-infra before being renamed to legal-rag-system; without this
  # pin, `docker compose up` from the current directory silently creates a
  # fresh, empty legal-rag-system_pgdata volume instead of reusing the one
  # holding the real corpus + embeddings, with no error to signal the mismatch.
  pgdata:
    name: phase1-corpus-infra_pgdata
